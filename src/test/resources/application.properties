spring.main.banner-mode=off

app.config.someValue=Some Config Value
app.config.version=1.0.0
app.monitoring.distribution.boundaries=1,2,5,10,25,50,100,250
app.monitoring.timer.boundaries=5,10,25,50,100,250,500,1

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

spring.security.oauth2.client.registration.sso.client-id=test
spring.security.oauth2.client.registration.sso.client-secret=test
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.redirect-uri={baseUrl}/login/oauth2/code/sso
spring.security.oauth2.client.registration.sso.scope=openid
spring.security.oauth2.client.provider.cognito.authorization-uri=http://localhost/oauth2/authorize
spring.security.oauth2.client.provider.cognito.token-uri=http://localhost/oauth2/token
spring.security.oauth2.client.provider.cognito.jwk-set-uri=http://localhost/.well-known/jwks.json
spring.security.oauth2.client.provider.cognito.user-info-uri=http://localhost/oauth2/userInfo
spring.security.oauth2.client.provider.cognito.user-name-attribute=sub

#########################################################################################################
### Logging
#########################################################################################################
# log file (console logging continues as well)
logging.file.name=logs/app.log
# or: logging.file.path=logs   -> writes logs/spring.log

# rolling (Logback is the default, so these apply)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log.gz

# levels
logging.level.root=INFO
logging.level.eu.meiyu.training.service=DEBUG
logging.level.eu.meiyu.training.aop=DEBUG