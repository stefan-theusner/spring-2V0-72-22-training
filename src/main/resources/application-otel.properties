#########################################################################################################
### OpenTelemetry (opentelemetry-spring-boot-starter) -> otel-collector from docker-compose.yaml
#########################################################################################################
otel.service.name=${spring.application.name}
otel.resource.attributes=deployment.environment.name=local
otel.exporter.otlp.endpoint=http://localhost:4318
otel.exporter.otlp.protocol=http/protobuf
otel.metric.export.interval=10000
# no log backend (Loki) in the stack yet
otel.logs.exporter=none
# bridge custom Micrometer metrics (TrackMetricAspect) into OpenTelemetry
otel.instrumentation.micrometer.enabled=true
