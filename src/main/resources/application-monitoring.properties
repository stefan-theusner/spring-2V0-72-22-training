#########################################################################################################
### Monitoring
#########################################################################################################
# Enable all endpoints
management.endpoints.web.exposure.include=*
# Requires spring.jmx.enabled=true
management.endpoints.jmx.exposure.include=*
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,BAD_PERFORMANCE,UNKNOWN,UP
# set http status to 200
management.endpoint.health.status.http-mapping.BAD_PERFORMANCE=200
# or when-authorized
management.endpoint.health.show-details=always

# show properties and their values
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always

#########################################################################################################
### JMX
#########################################################################################################
spring.jmx.enabled=true
spring.jmx.unique-names=true

app.monitoring.distribution.boundaries=1,2,5,10,25,50,100,250
app.monitoring.timer.boundaries=5,10,25,50,100,250,500,1