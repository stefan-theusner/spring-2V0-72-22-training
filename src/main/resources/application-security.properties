server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

#########################################################################################################
# Spring Authorization Server (Spring is the OIDC provider for Angular / Bruno)
#########################################################################################################
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080

spring.security.oauth2.authorizationserver.client.frontend.registration.client-id=frontend
spring.security.oauth2.authorizationserver.client.frontend.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.frontend.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.frontend.registration.redirect-uris=http://localhost:4200/callback,http://localhost:8080/oauth2/callback
spring.security.oauth2.authorizationserver.client.frontend.registration.scopes=openid,profile,email
spring.security.oauth2.authorizationserver.client.frontend.require-proof-key=true
spring.security.oauth2.authorizationserver.client.frontend.require-authorization-consent=false

spring.security.oauth2.authorizationserver.client.test.registration.client-id=test
spring.security.oauth2.authorizationserver.client.test.registration.client-secret={noop}test
spring.security.oauth2.authorizationserver.client.test.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.test.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.test.registration.scopes=api.read

app.security.idp-logout.endpoint=http://localhost:4566/cognito-idp/logout
app.security.idp-logout.post-logout-redirect-uri=http://localhost:8080/
app.security.signing-key.id=training-signing-key-1
app.security.signing-key.private=file:keys/auth-signing.key
app.security.signing-key.public=file:keys/auth-signing.pub

#########################################################################################################
# Spring Security OAuth2 OIDC / AWS Cognito (Floci-Sandbox) - Spring is the client
#########################################################################################################

# 1. Client registration
spring.security.oauth2.client.registration.sso.client-id=06598fe0df2542998c5d4806b1
spring.security.oauth2.client.registration.sso.client-secret=6e5f9363323d4df0be62cb10d8404d6737f173d30e344b6abb467570c639149c
spring.security.oauth2.client.registration.sso.scope=openid,profile,email
spring.security.oauth2.client.registration.sso.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sso.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.sso.client-name=Local Floci Cognito
spring.security.oauth2.client.registration.sso.provider=cognito

# 2. Provider definition (important for OIDC Metadata-Discovery)
#    clientId    : "06598fe0df2542998c5d4806b1"
#    userPoolId  : "us-east-1_2abe2b401"
#    to retrieve secret
#    pulumi stack output clientSecret --show-secrets
spring.security.oauth2.client.provider.cognito.issuer-uri=http://localhost:4566/us-east-1_2abe2b401
