# Transparent proxy in front of Floci that only restyles the Cognito hosted login page.
server {
    listen 4566;
    client_max_body_size 0;

    location = /__theme/login.css {
        alias /etc/nginx/theme/login.css;
        default_type text/css;
    }

    # Hosted UI pages: inject our stylesheet
    location /cognito-idp/ {
        proxy_pass http://floci:4566;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_redirect off;
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/__theme/login.css"></head>';

        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" always;
    }

    # Everything else (AWS APIs, OIDC discovery, JWKS, token) passes through untouched
    location / {
        proxy_pass http://floci:4566;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 900s;
    }
}
