#####################################################################################################
# Docker compose file to run on the host machine
#####################################################################################################
services:
    floci:
        image: floci/floci:latest
        ports:
            - "4566"
            - "7001-7099:7001-7099"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./data:/app/data
        environment:
            FLOCI_STORAGE_MODE: hybrid
            # Host directories ECS task definitions may mount (signing keys for the training-app task)
            FLOCI_SERVICES_ECS_HOST_VOLUME_ROOTS: ${PWD}/keys
    floci-proxy:
        image: nginx:1.27-alpine
        ports:
            - "4566:4566"
        volumes:
            - ./floci-theme/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./floci-theme:/etc/nginx/theme:ro
        depends_on:
            - floci
    #####################################################################################################
    # Observability: Spring Boot app (host) --OTLP--> otel-collector --> Prometheus / Tempo --> Grafana
    #####################################################################################################
    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.165.0
        command: ["--config=/etc/otelcol/config.yaml"]
        ports:
            - "4317:4317"   # OTLP gRPC
            - "4318:4318"   # OTLP HTTP (used by the Spring Boot starter)
            - "8889:8889"   # Prometheus metrics exported by the collector
        volumes:
            - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
        depends_on:
            - tempo
    prometheus:
        image: prom/prometheus:v3.16.0
        command:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.path=/prometheus
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
            - prometheus-data:/prometheus
        depends_on:
            - otel-collector
    tempo:
        image: grafana/tempo:2.10.10
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        ports:
            - "3200:3200"
        volumes:
            - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo
    grafana:
        image: grafana/grafana:13.3.1
        ports:
            - "3000:3000"
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
            GF_AUTH_DISABLE_LOGIN_FORM: "true"
        volumes:
            - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        depends_on:
            - prometheus
            - tempo

volumes:
    prometheus-data:
    tempo-data:
    grafana-data:
