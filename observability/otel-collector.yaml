# OpenTelemetry Collector: receives OTLP from the Spring Boot app,
# exposes metrics for Prometheus to scrape and forwards traces to Tempo.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Copy the deployment environment resource attribute onto every data point as "env",
  # which the "HTTP Metrics OpenTelemetry" dashboard uses as a filter variable.
  transform/env:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["env"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [transform/env, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
