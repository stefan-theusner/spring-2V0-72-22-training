[tools]
java="21"
node="v24.21.0"
devcontainer-cli="0.91.0"

[env]
MISE_SESSION="boot"

[tasks."dc:shell"]
description = "Devcontainer bash"
quiet = true
run = "devcontainer exec --workspace-folder . bash"

[tasks."dc:up"]
description = "Create / re-create devcontainer"
run = "devcontainer up --workspace-folder . --remove-existing-container"

### Container Tasks ###

[tasks."boot:startWithJMX"]
description = "Enable JMX Remote console by setting JAVA_OPTS env"
run="""
# It is passed to the forked app JVM via -PjvmArgs (see bootRun in build.gradle).
JMX_OPTS="-Dcom.sun.management.jmxremote \
-Dcom.sun.management.jmxremote.port=9010 \
-Dcom.sun.management.jmxremote.rmi.port=9010 \
-Dcom.sun.management.jmxremote.local.only=false \
-Dcom.sun.management.jmxremote.authenticate=false \
-Dcom.sun.management.jmxremote.ssl=false \
-Djava.rmi.server.hostname=127.0.0.1"

tmux new -d -s "${MISE_SESSION}" -- ./gradlew bootRun -PjvmArgs="$JMX_OPTS"
tmux ls
# Check if port used
# ss -tlnp | grep 9010
"""

[tasks."boot:debug"]
run="""
# It is passed to the forked app JVM via -PjvmArgs (see bootRun in build.gradle).
JVM_OPTS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:9010"
tmux new -d -s "${MISE_SESSION}" -- ./gradlew bootRun -PjvmArgs="$JVM_OPTS"
tmux ls
"""

[tasks."boot:start"]
description = "Creates a tmux session to start bootRun"
run= """
    JVM_OPTS="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9010"
    tmux new -d -s "${MISE_SESSION}" -- ./gradlew bootRun -PjvmArgs="$JVM_OPTS"
    tmux ls
"""

[tasks."boot:pane"]
description = "Show the session pane"
run= """
    tmux capture-pane -p -t "${MISE_SESSION}"
"""

[tasks."boot:stop"]
description = "Kills thetmux session to stop bootRun"
run= """
    tmux kill-session -t "${MISE_SESSION}"
"""

[tasks."boot:restart"]
description = "Kills thetmux session to stop bootRun"
run= """
    mise run boot:stop
    mise run boot:start
"""
