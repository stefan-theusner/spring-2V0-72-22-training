plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.33.1")
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.junit.platform:junit-platform-launcher'
}

springBoot {
	buildInfo()
}

tasks.named('bootBuildImage') {
	imageName = "${project.group}/training-app:${project.version}"
}

tasks.named('bootRun') {
	def extraJvmArgs = project.findProperty('jvmArgs')
	if (extraJvmArgs) {
		jvmArgs extraJvmArgs.toString().trim().split(/\s+/)
	}
    systemProperties = System.properties
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	jvmArgs '-XX:+EnableDynamicAgentLoading', '-Xshare:off'
	useJUnitPlatform()
	addTestListener(new TestListener() {
		@Override
		void beforeSuite(TestDescriptor suite) {}

		@Override
		void afterSuite(TestDescriptor suite, TestResult result) {}

		@Override
		void beforeTest(TestDescriptor descriptor) {}

		@Override
		void afterTest(TestDescriptor descriptor, TestResult result) {
			def duration = (result.endTime - result.startTime) / 1000.0
			def statusColor = result.resultType == TestResult.ResultType.SUCCESS ? "PASSED" : "FAILED"

			logger.lifecycle("   ${statusColor} : ${descriptor.className} -> ${descriptor.name} [${duration}s]")
		}
	})

	testLogging {
		showExceptions = true
		exceptionFormat = "full"
		//showCauses = true
		showStackTraces = true

		// Change to `true` for more verbose test output
		showStandardStreams = false
	}
}
